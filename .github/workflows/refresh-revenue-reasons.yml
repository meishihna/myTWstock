# 每月自動更新自選股「營收異動原因」事實層(頭條):FinMind TaiwanStockNews →
# web/public/data/revenue-reasons.json(有月營收訊號 ∩ 市值前段個股的近期營收相關頭條)。
#
# 於每月 12 日執行(月營收 refresh-month-revenue.yml 於 11 日已更新並 push)。
# 抓 10-12 日的月營收公告新聞群聚 → 解釋當月營收增減的原因(每則附日期/來源/連結)。
# why(一句話歸納)為深度層,由 /revenue-reasons 技能(Claude Code)另行補上,本 job 只做頭條,
# 且會保留既有 why(掉出名單者自然消失)。
#
# 需 repo secret FINMIND_TOKEN(已存在)。--top 130 × ~3 日 ≈ 390 次 < 580/hr → 不觸限流。
name: Refresh revenue reasons

on:
  workflow_dispatch:
  schedule:
    # 每月 12 日 UTC 04:00 = 台灣時間(UTC+8)12:00
    - cron: "0 4 12 * *"

concurrency:
  group: refresh-revenue-reasons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整歷史,供 push 撞車時 rebase 使用

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 事實層:抓有訊號 ∩ 市值前 130 檔的近期營收相關頭條(過濾雜訊、實質關鍵字優先)。
      - name: Build revenue reasons (headlines)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -u scripts/build_revenue_reasons.py --all --top 130 --date-span 2 --sleep 4
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/revenue-reasons.json || true
          if git diff --staged --quiet; then
            echo "No revenue-reasons changes."
            exit 0
          fi
          git commit -m "data: 更新營收異動原因頭條 (automated)"
          # 遠端可能被其他排程／手動 push 推進 → rebase 後再推,最多重試 5 次(不強推)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected; fetch + rebase onto origin/main (attempt $i)…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict, abort"; exit 1; }
          done
          echo "push still failing after retries"; exit 1
