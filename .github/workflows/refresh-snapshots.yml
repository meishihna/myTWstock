# 每日盤後刷新首頁市場快照:三大法人/資券(FinMind)、今日強勢股(yahoo)、今日熱門題材(新聞 NLP)。
# 產出 3 個 JSON → commit → push → Vercel 自動重新部署。
# 任一來源失敗不影響其他(continue-on-error);快照腳本各自取「最新可得日」,部分未更新也安全。
name: Refresh market snapshots

on:
  workflow_dispatch:
  schedule:
    # 台灣時間(UTC+8)約 18:00 盤後 = UTC 10:00,週一至週五
    - cron: "0 10 * * 1-5"

concurrency:
  group: refresh-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整歷史,供 push 撞車時 rebase 使用

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web deps
        working-directory: web
        run: npm ci

      # 重生索引(map-index 等),供 top-movers / today-themes 讀取
      - name: Build data indexes
        working-directory: web
        run: node scripts/build-data.mjs

      - name: 三大法人 + 資券 (market-focus.json)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_market_focus.py
        continue-on-error: true

      - name: 今日強勢股 (top-movers.json)
        working-directory: web
        run: node scripts/build-top-movers.mjs
        continue-on-error: true

      - name: 今日熱門題材 (today-themes.json)
        working-directory: web
        run: npx --yes tsx scripts/build-today-themes.ts
        continue-on-error: true

      - name: 熱力圖成交額快照 (heatmap-stats.json)
        working-directory: web
        run: node scripts/build-heatmap-stats.mjs
        continue-on-error: true

      # 估值快照:本益比/殖利率/股價淨值比(TWSE/TPEx 官方 OpenAPI)+ Beta(Yahoo 週線)。無需 FinMind。
      - name: 估值快照 (valuation-index.json)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet yfinance pandas
          python scripts/build_valuation_snapshot.py
        continue-on-error: true

      # 籌碼面快照:三大法人(TWSE T86)+ 融資融券(TWSE/TPEx)。純 urllib,無需額外套件。
      - name: 籌碼面快照 (chips-index.json)
        run: python scripts/build_chips_snapshot.py
        continue-on-error: true

      # 籌碼面走勢:三大法人近30交易日(append)+ 大戶每週累積。純 urllib。
      - name: 籌碼面走勢 (chips-history.json)
        run: python scripts/build_chips_history.py
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/market-focus.json web/public/data/top-movers.json web/public/data/today-themes.json web/public/data/heatmap-stats.json web/public/data/valuation-index.json web/public/data/chips-index.json web/public/data/chips-history.json || true
          if git diff --staged --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "chore: refresh market snapshots (automated)"
          # 遠端可能被其他排程／手動 push 推進 → rebase 後再推,最多重試 5 次(不強推)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected; fetch + rebase onto origin/main (attempt $i)…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict, abort"; exit 1; }
          done
          echo "push still failing after retries"; exit 1
