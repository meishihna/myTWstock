# 每季自動更新「季表 + 年表」財務資料:update_financials.py(FinMind 損益/現金流 + Yahoo + MOPS)
# → 寫入 data/financials_store/*.json 與各報告 ## 財務概況 表 → commit → push → Vercel 重新部署。
#
# 為何分片(--shard i/3):每檔至少 2 次 FinMind 呼叫 × 1,700+ 檔 ≈ 3,400+ 次,
# 免費額度約 600/hr → 全市場約 6 小時+,超過 GitHub 單一 job 6 小時上限,
# 故切 3 片、以 matrix + max-parallel:1 序列執行(同一 FinMind token 時額不重疊),
# 每片約 580 檔、約 2.5-3 小時,皆在限制內。
#
# 排程:各季財報申報截止(Q1 5/15、Q2 8/14、Q3 11/14、年報/Q4 3/31)後隔日觸發。
# 需 repo secret FINMIND_TOKEN(已存在)。亦可 Actions 頁 workflow_dispatch 手動全跑。
name: Refresh financials (quarterly)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 16 5,8,11 *" # Q1/Q2/Q3:5、8、11 月 16 日 UTC 02:00(=台灣 10:00)
    - cron: "0 2 5 4 *" # 年報/Q4:4 月 5 日(3/31 截止後)

concurrency:
  group: refresh-financials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 單片 ~2.5-3hr + rebase 緩衝(GitHub 硬上限 360)
    permissions:
      contents: write
    strategy:
      max-parallel: 1 # 序列執行:同一 FinMind token 每小時額度不重疊
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整歷史,供 push 撞車時 rebase 使用

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # FinMind 主來源(損益/現金流)+ Yahoo(費用拆分/估值)+ MOPS(三費/CAPEX 精確補洞)。
      # MOPS 若於 runner 連線/SSL 失敗會自動退回 FinMind+Yahoo(不中斷);
      # 若日後日誌顯示 MOPS SSL 錯誤,可加 MYTWSTOCK_MOPS_INSECURE_SSL: "1"。
      - name: Update financials (shard ${{ matrix.shard }}/3)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FINMIND_MAX_CALLS_PER_HOUR: "580"
          MYTWSTOCK_MOPS: "1"
        run: python -u scripts/update_financials.py --shard ${{ matrix.shard }}/3
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials_store Pilot_Reports || true
          if git diff --staged --quiet; then
            echo "No financials changes (shard ${{ matrix.shard }})."
            exit 0
          fi
          git commit -m "data(financials): 季更新 shard ${{ matrix.shard }}/3 (automated)"
          # 遠端可能被其他排程／手動 push 推進 → rebase 後再推,最多重試 5 次(不強推)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected; fetch + rebase onto origin/main (attempt $i)…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict, abort"; exit 1; }
          done
          echo "push still failing after retries"; exit 1
